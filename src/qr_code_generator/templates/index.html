<!DOCTYPE html>
<html lang="{{ language }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ translations.title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
</head>
<body>
    <div class="container">
        <h1>{{ translations.title }}</h1>
        <p class="subtitle">{{ translations.subtitle }}</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/">
            <div class="form-group">
                <label for="url">{{ translations.url_label }}</label>
                <input
                    type="url"
                    id="url"
                    name="url"
                    placeholder="https://example.com"
                    required
                    autocomplete="url"
                    value="{{ request.form.get('url', '') }}"
                >
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary">
                    {{ translations.generate }}
                </button>
            </div>
        </form>

        {% if qr_code_data %}
        <div class="qr-result">
            <h2>{{ translations.qr_result }}</h2>

            <div class="qr-image">
                <img
                    src="data:image/png;base64,{{ qr_code_data }}"
                    alt="{{ translations.qr_alt }}"
                >
            </div>

            <form method="POST" action="/download" class="qr-actions">
                <input
                    type="hidden"
                    name="url"
                    value="{{ request.form.url }}"
                >

                <button type="submit" class="btn btn-primary">
                    {{ translations.download }}
                </button>

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="copyToClipboard()"
                >
                    {{ translations.copy_button }}
                </button>
            </form>
        </div>
        {% endif %}
    </div>

    <script>
        async function copyToClipboard() {
            const img = document.querySelector('.qr-image img');
            if (!img) return;

            try {
                const response = await fetch(img.src);
                const blob = await response.blob();

                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': blob })
                ]);

                alert('{{ translations.copy_success }}');
            } catch (err) {
                console.error('{{ translations.copy_error_console }}', err);
                alert('{{ translations.copy_error }}');
            }
        }
    </script>
</body>
</html>
