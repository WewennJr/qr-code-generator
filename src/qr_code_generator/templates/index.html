<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de QR Code</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 2.5rem;
            width: 100%;
            max-width: 480px;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .subtitle {
            color: #666;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #333;
            margin-bottom: 0.5rem;
        }

        input[type="url"] {
            width: 100%;
            padding: 0.875rem 1rem;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fafafa;
        }

        input[type="url"]:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            background: white;
        }

        input[type="url"]::placeholder {
            color: #999;
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.875rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .btn-secondary {
            background-color: #e5e7eb;
            color: #374151;
        }

        .btn-secondary:hover {
            background-color: #d1d5db;
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 0.875rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
        }

        .qr-result {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e5e7eb;
            text-align: center;
        }

        .qr-result h2 {
            font-size: 1.125rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 1rem;
        }

        .qr-image {
            display: inline-block;
            background: white;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }

        .qr-image img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .qr-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            margin-top: 1.25rem;
        }

        .qr-actions .btn {
            flex: 0 0 auto;
            min-width: 140px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }

            .btn-group {
                flex-direction: column;
            }

            .qr-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Générateur de QR Code</h1>
        <p class="subtitle">Entrez une URL pour générer votre QR code</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/">
            <div class="form-group">
                <label for="url">URL</label>
                <input
                    type="url"
                    id="url"
                    name="url"
                    placeholder="https://example.com"
                    required
                    autocomplete="url"
                >
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary">Générer</button>
            </div>
        </form>

        {% if qr_code_data %}
        <div class="qr-result">
            <h2>Votre QR Code</h2>
            <div class="qr-image">
                <img src="data:image/png;base64,{{ qr_code_data }}" alt="QR Code généré">
            </div>
            <form method="POST" action="/download" class="qr-actions">
                <input type="hidden" name="url" value="{{ request.form.url }}">
                <button type="submit" class="btn btn-primary">Télécharger</button>
                <button type="button" class="btn btn-secondary" onclick="copyToClipboard()">Copier</button>
            </form>
        </div>
        {% endif %}
    </div>

    <script>
        async function copyToClipboard() {
            const img = document.querySelector('.qr-image img');
            if (!img) return;

            try {
                const response = await fetch(img.src);
                const blob = await response.blob();
                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': blob })
                ]);
                alert('QR Code copié dans le presse-papiers !');
            } catch (err) {
                console.error('Erreur lors de la copie:', err);
                alert('Impossible de copier. Utilisez le bouton Télécharger.');
            }
        }
    </script>
</body>
</html>
