<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de QR Code</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Générateur de QR Code</h1>
        <p class="subtitle">Entrez une URL pour générer votre QR code</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/">
            <div class="form-group">
                <label for="url">URL</label>
                <input
                    type="url"
                    id="url"
                    name="url"
                    placeholder="https://example.com"
                    required
                    autocomplete="url"
                >
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-primary">Générer</button>
            </div>
        </form>

        {% if qr_code_data %}
        <div class="qr-result">
            <h2>Votre QR Code</h2>
            <div class="qr-image">
                <img src="data:image/png;base64,{{ qr_code_data }}" alt="QR Code généré">
            </div>
            <form method="POST" action="/download" class="qr-actions">
                <input type="hidden" name="url" value="{{ request.form.url }}">
                <button type="submit" class="btn btn-primary">Télécharger</button>
                <button type="button" class="btn btn-secondary" onclick="copyToClipboard()">Copier</button>
            </form>
        </div>
        {% endif %}
    </div>

    <script>
        async function copyToClipboard() {
            const img = document.querySelector('.qr-image img');
            if (!img) return;

            try {
                const response = await fetch(img.src);
                const blob = await response.blob();
                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': blob })
                ]);
                alert('QR Code copié dans le presse-papiers !');
            } catch (err) {
                console.error('Erreur lors de la copie:', err);
                alert('Impossible de copier. Utilisez le bouton Télécharger.');
            }
        }
    </script>
</body>
</html>
